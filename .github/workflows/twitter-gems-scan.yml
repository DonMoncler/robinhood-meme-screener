name: twitter-gems-scan

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Twitter discovery scan
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
        run: python twitter_discovery.py

      - name: Commit updated data
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/twitter_gems.json
          git diff --quiet --cached || git commit -m "auto: twitter gems scan $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
