name: poll-and-publish

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore database cache
        uses: actions/cache/restore@v4
        with:
          path: screener.db
          key: screener-db-${{ github.run_id }}
          restore-keys: |
            screener-db-

      - name: Run poll cycle and export snapshot
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
        run: python export_snapshot.py

      - name: Save database cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: screener.db
          key: screener-db-${{ github.run_id }}

      - name: Commit updated data
        run: |
          git config user.name "screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json
          git diff --quiet --cached || git commit -m "auto: poll cycle $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
